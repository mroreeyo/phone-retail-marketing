[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_ 값은 설계상 브라우저에 공개된다. 비밀 값 검사는 NCP_MAPS_CLIENT_SECRET에만 적용한다.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_NCP_MAP_CLIENT_ID"
